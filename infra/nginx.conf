# Reverse proxy for a single-host deployment.
#
# TLS terminates here, so the API and frontend containers never need certificates.
# Both are served from one origin, which removes CORS from the browser path entirely.

upstream pumpatlas_api {
    server api:8000;
    keepalive 32;
}

upstream pumpatlas_web {
    server frontend:3000;
    keepalive 32;
}

# Uploads are datasheets and catalogues; the API enforces MAX_UPLOAD_MB itself.
client_max_body_size 64m;

# Login is the endpoint worth rate limiting: it is the one an attacker will hammer.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pumpatlas.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Metrics are for the scrape target, not the internet.
    location /api/v1/metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
        proxy_pass http://pumpatlas_api;
    }

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://pumpatlas_api;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/ {
        limit_req zone=api burst=120 nodelay;
        proxy_pass http://pumpatlas_api;
        include /etc/nginx/proxy_headers.conf;
        # Extraction of a large PDF can take a while before the first byte.
        proxy_read_timeout 180s;
    }

    location / {
        proxy_pass http://pumpatlas_web;
        include /etc/nginx/proxy_headers.conf;
    }
}
