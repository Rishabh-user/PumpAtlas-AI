# The same two services, built from the Dockerfiles instead of Render's native
# runtimes. Use this when you want the deployed image to be byte-for-byte what you
# run locally with docker compose, or when you move off Render and want the build to
# come with you. To use it, copy it over `render.yaml` and re-sync the blueprint.
#
# ---------------------------------------------------------------------------------
# Render blueprint for PumpAtlas AI.
#
# Two services from one repository: the API from `backend/`, the dashboard from
# `frontend/`. A monorepo needs nothing special here - each service names its own
# Dockerfile and its own build context, and Render builds only that folder.
#
# The DATABASE IS NOT DECLARED. It already exists on Render, and a blueprint sync that
# tried to recreate it would be the worst outcome available. Paste its connection string
# into DATABASE_URL below.
#
# Deploy in the SAME REGION as the database. PumpAtlas issues several queries per
# request; at a cross-continent round trip of ~250 ms a page costs seconds, while
# co-located it costs milliseconds. This is the single biggest performance decision here.
#
# No Redis and no Celery workers. Without a broker, `dispatch` falls back to running
# discovery inside the API process - the same behaviour as development. Everything works;
# a long sweep dies if the API restarts or scales. When that starts to matter, copy
# `infra/render.full.yaml` over this file: it adds Redis and three workers.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: pumpatlas-api
    runtime: docker
    region: oregon                 # must match the database's region
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render injects PORT; the Dockerfile's default of 8000 is for local use.
    dockerCommand: >-
      uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
      --forwarded-allow-ips '*'
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO

      # Paste the Internal Database URL from the Render dashboard, with the
      # `pumpatlas_app` credentials rather than the owner's.
      #
      # This matters more than anything else in this file. `pumpatlas_app` is
      # NOBYPASSRLS and owns no tables; connecting as the owner silently disables every
      # row-level-security policy, and one client's approved supplier list becomes
      # readable by another. Nothing errors when this is wrong - there is simply no
      # tenant boundary any more.
      - key: DATABASE_URL
        sync: false

      # Signs session tokens, and derives the Fernet key that decrypts the AI provider
      # keys held in `ai_provider_configs`. Generated once here; if you ever add the
      # workers, they must carry the identical value or they cannot read what the API
      # wrote.
      - key: SECRET_KEY
        generateValue: true

      # Only for *other* applications calling this API directly from a browser. The
      # dashboard does not need it: its browser code goes through `/api/proxy` on its own
      # origin, so no cross-origin request is ever made. Set it to the other
      # application's origin, e.g. https://portal.example.com.
      #
      # Left as a secret rather than wired to the dashboard's host on purpose - two
      # services referencing each other's properties is a circular blueprint reference,
      # and this one buys nothing.
      - key: CORS_ORIGINS
        sync: false

      # Object storage for uploaded documents. Leave unset and uploads go to the
      # container's own disk, which Render replaces on every deploy - set these before
      # storing anything that matters.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false

      # Optional. AI provider keys are not deployment configuration: they live encrypted
      # in the database and are set on the /ai-settings page, which also chooses which
      # provider is active. These remain only as a fallback for a brand new deployment
      # that has not visited that page.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PARALLEL_API_KEY
        sync: false

  # ----------------------------------------------------------- Dashboard
  - type: web
    name: pumpatlas-web
    runtime: docker
    region: oregon                 # same region as the API and the database
    plan: starter
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production

      # Where this server reaches the API, over Render's private network.
      #
      # `hostport` yields `pumpatlas-api:10000` - a host and a port, with no scheme,
      # which `fetch()` rejects. A blueprint cannot concatenate strings, so `lib/api.ts`
      # adds `http://` when the address arrives without one. The browser never uses this
      # value; every browser request goes to `/api/proxy` on this same service, which
      # swaps the httpOnly session cookie for an Authorization header.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: pumpatlas-api
          property: hostport
